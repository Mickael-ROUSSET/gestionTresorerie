jobs:
  build-and-test:
    name: Build et tests Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérifier la syntaxe des scripts de conditionnement
        shell: pwsh
        run: |
          foreach ($script in @('.github/scripts/package-demo.ps1', '.github/scripts/build-demo-installer.ps1', '.github/scripts/test-demo-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Output $_.Message }
              throw "Erreur de syntaxe PowerShell : $script"
            }
          }
      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Informations environnement
        run: dotnet --info
      - name: Préparer MSBuild Visual Studio
        uses: microsoft/setup-msbuild@v2
      - name: Restaurer les dépendances
        run: dotnet restore gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj
      # ResolveComReference nécessite MSBuild de Visual Studio (Framework), pas dotnet build.
      - name: Compiler application et tests
        run: msbuild gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj /restore /p:Configuration=Release /p:Platform="Any CPU" /m
      - name: Exécuter les tests
        timeout-minutes: 5
        run: dotnet test gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj --configuration Release --no-build --property:Platform="Any CPU" --filter "TestCategory!=LocalDbIntegration" --logger "trx;LogFileName=results.trx" --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none
