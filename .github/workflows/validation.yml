name: Validation .NET Windows

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build et tests Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Informations environnement
        run: dotnet --info
      - name: Préparer MSBuild Visual Studio
        uses: microsoft/setup-msbuild@v2
      - name: Restaurer les dépendances
        run: dotnet restore gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj
      # ResolveComReference nécessite MSBuild de Visual Studio (Framework), pas dotnet build.
      - name: Compiler application et tests
        run: msbuild gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj /restore /p:Configuration=Release /p:Platform="Any CPU" /m
      - name: Exécuter les tests
        run: dotnet test gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore
