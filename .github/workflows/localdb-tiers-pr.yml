name: LocalDB Tiers TEST (PR)
on:
  pull_request:
    paths:
      - 'gestionTresorerie/Infrastructure/Data/Repositories/SqlTiersTestStore.vb'
      - 'gestionTresorerie.Tests/SqlTiers*'
      - '.github/workflows/localdb-tiers-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localdb-tiers:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGUMAAA_RUN_LOCALDB_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Vérifier LocalDB sur le runner jetable
        shell: pwsh
        run: |
          $cmd = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $cmd) {
            $cmd = Get-Item 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $cmd) { throw 'SQL Server LocalDB absent du runner Windows ; installation nécessaire.' }
          & $(if ($cmd -is [System.Management.Automation.ApplicationInfo]) { $cmd.Source } else { $cmd.FullName }) info
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de consulter les instances LocalDB.' }
      - name: Restaurer et compiler les tests Windows
        shell: pwsh
        run: |
          dotnet restore gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj --property:Platform="Any CPU"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:RestoreIgnoreFailedSources=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exécuter réellement les tests LocalDB Tiers
        shell: pwsh
        run: |
          # Ne jamais accepter un rapport conservé d'une exécution précédente.
          $resultsDir = 'gestionTresorerie.Tests/TestResults'
          if (Test-Path -LiteralPath $resultsDir) { Remove-Item -LiteralPath $resultsDir -Recurse -Force }
          dotnet test gestionTresorerie.Tests/gestionTresorerie.Tests.vbproj --configuration Release --no-build --property:Platform="Any CPU" --filter "FullyQualifiedName~SqlTiersReinitializationIntegrationTests" --logger "trx;LogFileName=tiers-localdb.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = Get-ChildItem -Path gestionTresorerie.Tests/TestResults -Filter tiers-localdb.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { throw 'Aucun fichier TRX LocalDB produit : validation impossible.' }
          [xml]$results = Get-Content -LiteralPath $trx.FullName -Raw
          $counters = $results.TestRun.ResultSummary.Counters
          if (-not $counters) { throw 'Compteurs TRX absents : validation impossible.' }
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $skipped = [int]$counters.notExecuted
          $outcome = [string]$results.TestRun.ResultSummary.outcome
          Write-Host "LocalDB Tiers TRX : total=$total passed=$passed failed=$failed skipped=$skipped outcome=$outcome"
          if ($total -lt 2 -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0 -or $outcome -ne "Completed") {
            throw "Validation LocalDB insuffisante : total=$total passed=$passed failed=$failed (2 tests minimum requis)."
          }
      - name: Conserver les résultats même en échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiers-localdb-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
